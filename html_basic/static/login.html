<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;}
.box{width:340px;padding:30px;background:#fff;border-radius:10px;box-shadow:0 2px 12px #00000015;}
h2{text-align:center;margin-bottom:24px;color:#2c3e50;}
input{width:100%;padding:10px 12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:16px;}
button{width:100%;padding:11px;border:none;background:#2c3e50;color:#fff;border-radius:6px;font-size:16px;margin-top:12px;cursor:pointer;}
.link{margin-top:16px;text-align:center;color:#444;font-size:14px;}
a{color:#3498db;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
<h2>系统登录</h2>
<input type="text" id="username" placeholder="用户名">
<input type="password" id="password" placeholder="密码">
<button onclick="doLogin()">登录</button>
<div class="link">没有账号？<a href="register.html">注册账号</a></div>
</div>

<script>
async function doLogin(){
    const user = document.getElementById("username").value;
    const pwd = document.getElementById("password").value;
    if(!user || !pwd){
        alert("请填写用户名密码");
        return;
    }
    try{
        const res = await fetch("/user/token",{
            method:"POST",
            headers:{"Content-Type":"application/x-www-form-urlencoded"},
            body: new URLSearchParams({username:user,password:pwd})
        });
        const data = await res.json();
        if(!res.ok){
            alert(data.detail || "登录失败");
            return;
        }
        // 存储token
        localStorage.setItem("access_token", data.access_token);
        alert("登录成功");
        // 跳转到主页面
        window.location.href = "index.html";
    }catch(err){
        alert("网络请求异常");
        console.error(err);
    }
}
</script>
</body>
</html>
