<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人居微环境视觉检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100%;
        }
        /* 左侧侧边导航 */
        .sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: #fff;
            padding-top: 24px;
            transition: 0.3s;
        }
        .sidebar .menu-item {
            padding: 14px 24px;
            cursor: pointer;
            font-size: 16px;
        }
        .sidebar .menu-item:hover {
            background-color: #34495e;
        }
        .sidebar .menu-item.active {
            background-color: #3498db;
        }
        /* 主内容区域，放iframe */
        .main-content {
            flex: 1;
            height: 100%;
        }
        #content-iframe {
            width:100%;
            height:100%;
            border:none;
        }
        /* 移动端汉堡按钮 */
        .hamburger {
            display: none;
            position: fixed;
            top:12px;
            left:12px;
            z-index:99;
            background:#2c3e50;
            color:white;
            border:none;
            padding:8px 12px;
            font-size:18px;
        }

        @media (max-width:768px){
            .hamburger {
                display:block;
            }
            .sidebar {
                position:fixed;
                left:-220px;
                height:100%;
                z-index:98;
            }
            .sidebar.open {
                left:0;
            }
        }
    </style>
</head>
<body>
<button class="hamburger" id="hamburger">☰</button>
<div class="container">
    <aside class="sidebar" id="sidebar">
        <div class="menu-item active" data-src="mold_analyze.html">图片检测</div>
        <!-- <div class="menu-item" data-src="mold_analyze_duo.html">多图评估</div> -->
        <div class="menu-item" data-src="mold_detect.html">视频轮巡检测</div>
        <!-- <div class="menu-item" data-src="placeholder_history.html">历史评估报告</div> -->
        <!-- <div class="menu-item" data-src="env_history.html">温湿度曲线</div> -->
        <div class="menu-item" data-src="placeholder_help.html">使用帮助</div>
    </aside>
    <main class="main-content">
        <iframe id="content-iframe" src="mold_analyze.html"></iframe>
    </main>
</div>

<script>
    // 菜单切换逻辑
    const menuItems = document.querySelectorAll('.menu-item');
    const iframe = document.getElementById('content-iframe');
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');

    menuItems.forEach(item => {
        item.addEventListener('click', ()=>{
            // 清除全部active
            menuItems.forEach(mi=>mi.classList.remove('active'));
            item.classList.add('active');
            // 加载对应页面到iframe
            const pageUrl = item.getAttribute('data-src');
            iframe.src = pageUrl;
            // 移动端点击菜单自动收起侧边栏
            if(window.innerWidth <=768){
                sidebar.classList.remove('open');
            }
        })
    })
    // 移动端汉堡开关侧边栏
    hamburger.addEventListener('click',()=>{
        sidebar.classList.toggle('open');
    })
</script>
</body>
</html>
