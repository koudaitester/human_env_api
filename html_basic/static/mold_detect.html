<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人居微环境 - 视频轮巡霉菌检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 24px;
        }
        h1 {
            color: #2d3748;
            font-size: 24px;
        }
        .sub-title {
            color: #718096;
            margin-top: 6px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 10px #00000010;
        }
        .video-area {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        #video-preview {
            max-width: 100%;
            border-radius: 8px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: 0;
            background: #3182ce;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        .risk-tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 99px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 16px;
        }
        .risk-low {
            background: #38a169;
        }
        .risk-warn {
            background: #d69e2e;
        }
        .risk-mid {
            background: #dd6b20;
        }
        .risk-high {
            background: #c53030;
        }
        .result-block h3 {
            color: #2d3748;
            margin: 14px 0 8px;
        }
        .result-block p {
            color: #4a5568;
            line-height: 1.6;
        }
        .tips {
            margin-top: 24px;
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>人居微环境视觉检测 - 视频轮巡</h1>
            <div class="sub-title">实时截取画面进行霉菌风险评估</div>
        </header>
        <div class="row">
            <!-- 左侧视频预览 + 控制按钮 -->
            <div class="card">
                <div class="video-area">
                    <video id="video-preview" autoplay playsinline muted></video>
                </div>
                <button id="start-btn">启动轮巡检测</button>
                <button id="stop-btn" disabled>停止轮巡检测</button>
            </div>
            <!-- 右侧结果 -->
            <div class="card">
                <h2>实时评估结果</h2>
                <div id="result-wrap">
                    <p style="color:#718096;margin-top:20px;">启动摄像头轮巡，此处展示实时风险报告</p>
                </div>
            </div>
        </div>
        <div class="tips">⚠️ 提示：本系统仅作为人居环境辅助评估，不能替代专业环境检测。持续轮巡会消耗算力。</div>
    </div>

    <script src="/html_basic/static/common.js"></script>
    <script>
        const videoEl = document.getElementById('video-preview');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resultWrap = document.getElementById('result-wrap');

        let mediaStream = null;
        let timerId = null;
        const POLL_INTERVAL = 10000; // 每3秒截帧调用一次接口，可以自行调整

        // canvas 临时画布，截图
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // 启动摄像头
        startBtn.onclick = async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } // 优先后置摄像头
                });
                videoEl.srcObject = mediaStream;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                resultWrap.innerHTML = `<p>摄像头已开启，开始轮巡检测...</p>`
                // 启动定时轮询
                timerId = setInterval(captureFrameAndDetect, POLL_INTERVAL);
            } catch(err){
                resultWrap.innerHTML = `<p style="color:red;">无法调取摄像头，请授权相机权限</p>`
                console.error(err);
            }
        }

        // 停止
        stopBtn.onclick = () => {
            if(timerId){
                clearInterval(timerId);
                timerId = null;
            }
            if(mediaStream){
                mediaStream.getTracks().forEach(track=>track.stop());
                mediaStream=null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            resultWrap.innerHTML = `<p>轮巡已停止</p>`
        }

        // 修改视频页面里 captureFrameAndDetect
        async function captureFrameAndDetect(){
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            ctx.drawImage(videoEl, 0,0);
            const blob = await new Promise(resolve=> canvas.toBlob(resolve, 'image/jpeg',0.8));
            const formData = new FormData();
            formData.append("file", blob, "frame.jpg"); // 补上文件名，和上传页一致

            // 视频轮巡优先走纯视觉visual接口；后面如果要叠加温湿度，再切full
            const url = "http://127.0.0.1:8000/api/v1/mold/visual";
            try{
                const res = await apiRequest(url,{
                    method:"POST",
                    body:formData
                })
                const apiResp = await res.json();
                console.log("帧结果：", apiResp);
                if(apiResp.code !==200){
                    resultWrap.innerHTML = `<p style="color:red;">接口异常 code:${apiResp.code}</p>`
                    return;
                }
                const data = apiResp.data;
                resultWrap.innerHTML = `
                    <span class="risk-tag ${data.riskClass}">${data.riskLevel}</span>
                    <div class="result-block">
                        <h3>风险描述</h3>
                        <p>${data.desc}</p>
                        <h3>整改建议</h3>
                        <p>${data.suggest}</p>
                    </div>
                `
            }catch(err){
                console.error(err);
                resultWrap.innerHTML = `<p style="color:red;">轮巡调用失败，继续等待下一帧</p>`
            }
        }
</script>
</body>
</html>
